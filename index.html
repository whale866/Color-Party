                side = (prevX >= sb.right - 1) ? 'right'
                     : (prevX + e.w <= sb.left + 1) ? 'left'
                     : (e.x + e.w / 2 >= (sb.left + sb.right) / 2 ? 'right' : 'left');
                e.bagSide = side;
              }
              e.x = (side === 'right') ? sb.right : (sb.left - e.w);
              e.vx = 0;                       // 只停位移，不改 AI 方向 → 继续左右晃
            }
          } else {
            // 原矮障碍逻辑（保持原样）：可跳过、可落顶、可走下
            var footNow = e.y + e.h;
            var overBag = footNow <= sb.top + 1;   // 跳起越过 / 正站在顶上
            if (!overBag && e.x < sb.right && e.x + e.w > sb.left &&
                footNow > sb.top && e.y < sb.bottom) {
              if (prevX + e.w <= sb.left + 1)      e.x = sb.left - e.w;  // 从左往右撞
              else if (prevX >= sb.right - 1)      e.x = sb.right;        // 从右往左撞
              else                                  e.x = (e.vx >= 0) ? sb.right : sb.left - e.w;
              e.vx = 0;
            }
          }
        }

        // ⑤ 屏幕左右边界（保持原有逻辑）
        if (e.x < 0) { e.x = 0; e.vx = 0; }
        if (e.x + e.w > window.innerWidth) { e.x = window.innerWidth - e.w; e.vx = 0; }
      }

      function isPausedNow() {
        return (typeof defendPaused !== 'undefined') && defendPaused === true;
      }

      // ---- 绘制：角色 + 头顶圆角血条 + 玩家蓝色倒三角 + 表演子弹 ----
      function roundRect(x, y, w, h, r) {
        cx.beginPath();
        cx.moveTo(x + r, y);
        cx.arcTo(x + w, y, x + w, y + h, r);
        cx.arcTo(x + w, y + h, x, y + h, r);
        cx.arcTo(x, y + h, x, y, r);
        cx.arcTo(x, y, x + w, y, r);
        cx.closePath();
      }
      // ---- 绘制单个角色：本体按左右朝向水平镜像，头顶 UI 不翻转 ----
      // 与射击派对 drawEntity() 中 "if (!ent.facingRight) ctx.scale(-1, 1)"
      // 同款思路：以角色自身竖直中轴做 scale(-1,1)，保持占位框位置不变，
      // 只让贴图画左右镜像。原素材是持枪朝右的立绘，翻转后枪口与脸朝左，
      // 于是"向左走脸朝左 / 向右走脸朝右"与射击派对观感一致。
      // 注意：此处 cx 是本场景的 2D 上下文（闭包顶部 var cx = cv.getContext('2d')），
      // 与射击派对 drawEntity 里表示中心 x 的局部 const cx 不是同一个东西。
      function drawEnt(e) {
        // 血量归零的 whale：直接消失（不画本体、不画血条、不留残影）
        if (e.alive === false) return;
        // ① 先按图片真实比例校正宽度：这一步会改 e.x / e.w，
        //    必须放在计算镜像轴之前，否则翻转中轴会偏、角色会左右横跳。
        if (imgOK(e)) {
          var realW = e.img.naturalWidth * (e.h / e.img.naturalHeight);
          if (Math.abs(realW - e.w) > 0.5) { e.x += (e.w - realW) / 2; e.w = realW; }
        }

        // ② 朝向判定：默认以"实际移动速度"优先兜底，静止时沿用 facingRight。
        //    【新增】enemy/luni 攻击中(aiming=true) 时【优先用瞄准朝向】，
        //    让枪口正对被锁定的 whale，不被 vx 的移动方向翻转覆盖；
        //    非攻击角色(catgirl 玩家 / whale / 无目标时的 AI) 保持原规则，
        //    "向左走脸朝左 / 向右走脸朝右"与射击派对一致。
        var faceRight = e.facingRight;
        if (!e.aiming) {
          if (e.vx > 0.1)      faceRight = true;
          else if (e.vx < -0.1) faceRight = false;
        }

        // ③ 只把「角色本体」包进镜像变换，画完立刻 restore，
        //    后面的血条、蓝色倒三角、以及其它角色都不受影响。
        cx.save();
        if (!faceRight) {
          var axisX = e.x + e.w / 2;      // 角色自身竖直中轴
          cx.translate(axisX, 0);
          cx.scale(-1, 1);
          cx.translate(-axisX, 0);
        }
        if (imgOK(e)) {
          cx.drawImage(e.img, e.x, e.y, e.w, e.h);
        } else {
          // 图片未就绪时的占位色块同样跟随朝向，避免翻转前后观感割裂
          cx.fillStyle = e.color;
          cx.globalAlpha = 0.35;
          cx.fillRect(e.x, e.y, e.w, e.h);
          cx.globalAlpha = 1;
        }
        cx.restore();

        // ④ 头顶血条：用绝对坐标正常绘制，绝不跟着镜像翻转；
        //    按 hp / maxHp 实时收缩，whale 被子弹命中后真实掉血
        //    【本次改动】结构对齐射击派对 drawEntity() 的圆角血条：
        //      · 血量填充统一为射击派对同款绿色 DEF_HP_FILL(#32CD32)，
        //        不再用 e.color —— 修掉「血条颜色和血条框颜色都一样」；
        //      · 血条框(描边) 用各自 e.color 且保持不变：
        //        catgirl 蓝框 / enemy 绿框 / luni 红框；按确认，enemy
        //        「绿框 + 绿填充」也不换色；
        //      · 底色半透明黑槽、尺寸、位置、满格比例一律不动。
        //    整段用 save/restore 包住，lineWidth / strokeStyle 不泄漏到
        //    后面的倒三角、子弹与其它角色绘制。
        var bw = Math.max(48, e.w * 0.72), bh = 8;
        var bx = e.x + (e.w - bw) / 2, by = e.y - 18;
        cx.save();
        // 底色槽（保持原样）
        cx.fillStyle = 'rgba(0,0,0,0.18)';
        roundRect(bx, by, bw, bh, 4); cx.fill();
        // 血量填充：九个实体统一绿色，与射击派对一致（大号按 200/200 收缩）
        cx.fillStyle = DEF_HP_FILL;
        roundRect(bx, by, bw * (e.hp / e.maxHp), bh, 4); cx.fill();
        // 血条框：描边色 = 角色自身主题色，保持不变（对齐射击派对 strokeStyle=ent.color）
        cx.strokeStyle = e.color;
        cx.lineWidth = 2;
        roundRect(bx, by, bw, bh, 4); cx.stroke();
        cx.restore();
        // 玩家头顶蓝色倒三角
        if (e.isPlayer) {
          var tx = e.x + e.w / 2, ty = by - 12;
          cx.fillStyle = '#00bfff';
          cx.beginPath();
          cx.moveTo(tx - 9, ty); cx.lineTo(tx + 9, ty); cx.lineTo(tx, ty + 12);
          cx.closePath(); cx.fill();
        }
      }
      function draw() {
        cx.clearRect(0, 0, cv.width, cv.height);
        bullets.forEach(function (b) {
          cx.fillStyle = b.color;
          cx.beginPath(); cx.arc(b.x, b.y, 4, 0, Math.PI * 2); cx.fill();
        });
        entities.forEach(drawEnt);
      }

      function frame(t) {
        if (!running) return;
        rafId = requestAnimationFrame(frame);
        var dt = lastT ? Math.min(t - lastT, 34) : 16;
        lastT = t;

        if (!isPausedNow()) {
          var p = entities[0];
          // 玩家：摇杆移动 / 跳 / 按住开火连发
          p.vx = joystickX * SPEED;
          // 摇杆向右 → 脸朝右；向左 → 脸朝左（绘制层做水平镜像）
          if (joystickX !== 0) p.facingRight = joystickX > 0;
          if (wantShoot && t - lastPlayerFire > FIRE_CD) { fire(p); lastPlayerFire = t; }
          // 所有非玩家角色统一走 AI：enemy / luni 随机移动 + 自动攻击 whale
          // + 贴袋起跳；5 只普通 whale(chargeLeft) 恒左冲锋、贴袋连跳、绝不回头；
          // 大号 whale(已生成时) 恒左冲锋但【不跳】。
          // 阵亡 / 尚未生成(alive=false) 的 whale 在 aiUpdate 开头即被跳过。
          // 用遍历而非写死下标，后续增减角色无需再改这里。
          for (var ai = 1; ai < entities.length; ai++) {
            aiUpdate(entities[ai], t, dt);
          }
          // 全员平等地走同一套物理：物理层无伤害结算
          entities.forEach(physics);
          // 若本帧 physics 里触发了「whale 碰到 granary → 失败」，立刻清空
          // 子弹并跳过后续结算；失败界面已盖在最上层、循环也已停止。
          if (defendFailed) bullets = [];
          // ---- 子弹：飞行 + 出界回收 + 【只对存活 whale 的命中判定】----
          // 目标集合只含 chargeLeft && alive 的 whalegirl（含大号 whale）：
          //   · catgirl / enemy / luni 的子弹都能打掉 whale 的血；
          //   · 三角色永远不在目标集合里 → 彼此零伤害、whale 也绝不反击；
          //   · 同一发子弹命中即销毁，不穿透、不重复结算。
          if (!defendFailed) bullets = bullets.filter(function (b) {
            b.x += b.vx;
            if (b.x < -20 || b.x > cv.width + 20) return false;
            for (var wi = 0; wi < entities.length; wi++) {
              var w = entities[wi];
              if (!w.chargeLeft || w.alive === false) continue;
              if (b.x >= w.x && b.x <= w.x + w.w &&
                  b.y >= w.y && b.y <= w.y + w.h) {
                w.hp -= BULLET_DAMAGE;
                defPlay('hit');                    // 复用射击派对同款受击音
                if (w.hp <= 0) {
                  w.hp = 0;
                  w.alive = false;                // 直接消失（不留残影）
                  w.vx = 0; w.vy = 0;
                  whaleKillCount++;               // 累计被击杀数（普通 + 大号都计入）
                  // 播报①：每击退 1 只 whalegirl（普通 + 大号）推 1 条
                  pushFeed(DEF_FEED_KILL);
                  // 【大号 whale】被击杀：直接消失、【不补位】，但同样让
                  //   对决栏 31/31 往下掉 1（上面这行 whaleKillCount++ 已计入）。
                  // 【普通 whale】：
                  //   · 击杀数 <= NORMAL_RESPAWN_UNTIL(25)：同帧在最右侧补位，
                  //     保持场上恒 5 只普通 whale；补位不回涨右侧数值；
                  //   · 击杀数达到 BIG_WHALE_TRIGGER(25) 且大号尚未生成：
                  //     同帧生成唯一一只大号 whale（额外第 6 个个体）；
                  //   · 击杀数 > 25：不再补位，进入「最后 5 只普通 whale」
                  //     逐个递减阶段，连同大号一起被击杀到 0/31。
                  if (!w.isBig) {
                    if (whaleKillCount <= NORMAL_RESPAWN_UNTIL) respawnWhale(w);
                    if (whaleKillCount >= BIG_WHALE_TRIGGER && !bigWhaleSpawned) {
                      spawnBigWhale();
                    }
                  }
                  updateDuelBar();                // 右侧 31/31 往下掉 1
                }
                return false;                     // 命中即销毁这发子弹
              }
            }
            return true;
          });
        } else {
          // 暂停：冻结输入，避免在遮罩下仍蓄力
          wantShoot = false;
          joystickX = 0;
        }
        draw();   // 暂停时仍绘制当前静态帧，画面不黑
      }

    // ---------------- 按键绑定 ----------------
    function bindBtn(id, key) {
      const btn = document.getElementById(id);
      const start = (e) => { e.preventDefault(); controls[key] = true; };
      const end = (e) => { e.preventDefault(); controls[key] = false; };
      btn.addEventListener('touchstart', start, {passive: false});
      btn.addEventListener('touchend', end, {passive: false});
      btn.addEventListener('touchcancel', end, {passive: false});
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }
    bindBtn('btn-jump', 'jump');
    bindBtn('btn-shoot', 'shoot');

    // ---------------- 暂停 ----------------
    // 统一的状态管理函数：同时控制暂停按钮图标、暂停遮罩/标题、以及
    // 暂停态下的 back.png 返回按钮。三者在视觉上绑定为同一个"暂停态"，
    // 这样点击 back.png 返回时暂停态会自动解除，不会留下悬挂的暂停遮罩。
    var pauseBtnEl = document.getElementById('btn-pause');
    var pauseBackEl = document.getElementById('btn-pause-back');
    function setPaused(val) {
      if (val === isPaused) return;   // 状态未变化时不重复处理
      isPaused = val;
      pauseBtnEl.innerText = isPaused ? '▶' : '||';
      if (pauseBackEl) {
        pauseBackEl.classList.toggle('show', isPaused);
      }
      // 同步切换暂停遮罩层：进入暂停时显示“暂停”文字，退出时隐藏
      var pauseOverlayEl = document.getElementById('pause-overlay');
      if (pauseOverlayEl) {
        pauseOverlayEl.classList.toggle('show', isPaused);
      }
      if (!isPaused) {
        // 从暂停恢复：把暂停期间累积的时间差补回所有计时器，
        // 避免解冻后"快进"式的一瞬间连发、连刷道具或连死。
        const now = Date.now();
        const delta = now - lastFrameTime;
        entities.forEach(ent => {
          if (ent.isDead) ent.respawnTimer += delta;
          ent.aiMoveTimer += delta;
          ent.aiJumpCooldown += delta;
          ent.tankLastShoot += delta;
        });
        lastShootTime += delta;
        lastEnemyShootTime += delta;
        lastLuniShootTime += delta;
        lastRadioSpawnTime += delta;
        lastMedkitSpawnTime += delta;
      } else {
        lastFrameTime = Date.now();
      }
    }

    // ---------------- 彻底退出本局 ----------------
    // 关键修复：之前点 back.png 返回后游戏仍在后台运行，原因是只把
    // game-container 隐藏、isPaused 置 true，但 requestAnimationFrame
    // 循环没取消、计时器没清零、实体和子弹没清空，引擎其实还在跑。
    // 现在新增 exitGame()：取消动画帧 → 重置所有局内状态 → 清空画布，
    // 并保留 startGame 只启动一次的前提，下次进局能全新初始化。
    function resetGameState() {
      // 1) 取消主循环：这是最重要的一步，否则 update() 会一直执行
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = 0;
      }

      // 2) 清空局内数据：实体、子弹、复活计时、开火冷却、道具刷新计时全部归零
      bullets.length = 0;
      entities.forEach(ent => {
        ent.hp = ent.maxHp;
        ent.isDead = false;
        ent.respawnTimer = 0;
        ent.inTank = false;
        ent.tankHp = ent.tankMaxHp;
        ent.vx = 0; ent.vy = 0;
        ent.kills = 0;
        ent.aiMoveTimer = 0;
        ent.aiMoveDir = 0;
        ent.aiJumpCooldown = 0;
        ent.tankLastShoot = 0;
        ent.isTeleporting = false;
      });
      lastShootTime = 0;
      lastEnemyShootTime = 0;
      lastLuniShootTime = 0;
      lastRadioSpawnTime = 0;
      lastMedkitSpawnTime = 0;
      lastFrameTime = 0;

      // 3) 清空画布，避免返回后 canvas 上还残留上一局的画面
      if (ctx && canvas) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 4) 关闭音效：避免返回后还有音效在播放
      if (SoundFX && SoundFX.master) {
        try { SoundFX.master.gain.value = 0; } catch (e) {}
      }

      // 5) 清空播报栏与装填条
      var feed = document.getElementById('kill-feed');
      if (feed) feed.innerHTML = '';
      var reloadBar = document.getElementById('reload-bar');
      if (reloadBar) reloadBar.style.transform = 'scaleX(0)';
      var reloadContainer = document.getElementById('reload-bar-container');
      if (reloadContainer) reloadContainer.style.display = 'none';

      // 6) 重置操作输入与摇杆状态，避免返回时还按着方向键、再进来直接乱跑
      controls.left = false; controls.right = false;
      controls.jump = false; controls.shoot = false;
      joystickInputX = 0;
      var stick = document.getElementById('joystick-stick');
      var base = document.getElementById('joystick-base');
      if (stick) stick.style.transform = 'translate(-50%, -50%)';
      if (base) { base.style.left = '40px'; base.style.bottom = '40px'; }
    }

    function exitGame() {
      // 先解除暂停，让所有状态（遮罩、按钮、isPaused）都回到非暂停态
      setPaused(false);
      // 重置并停掉引擎
      resetGameState();
      // 标记本局已结束，下次进局会重新初始化（而不是接着旧局跑）
      gameStarted = false;
      // 隐藏游戏容器并做短促淡出，回到派对选择
      gameContainer.classList.add('fading-out');
      setTimeout(function () {
        gameContainer.style.display = 'none';
        gameContainer.classList.remove('fading-out');
        gameContainer.style.opacity = '';
        whiteScreen.classList.add('show');
        whiteScreen2.classList.remove('show');
        gameHint.style.display = 'none';
        // 恢复音效音量（为下一局准备）
        if (SoundFX && SoundFX.master) {
          try { SoundFX.master.gain.value = 0.35; } catch (e) {}
        }
      }, 180);
    }

    pauseBtnEl.addEventListener('click', (e) => {
      e.preventDefault();
      // 第一次点：进入暂停 → back.png 出现（状态绑定）
      // 第二次点：退出暂停 → back.png 消失（状态绑定）
      // 这就实现了"先点暂停才出，再点暂停就消失"的联动效果。
      setPaused(!isPaused);
    });

    // 退出确认浮层逻辑
    var exitConfirm = document.getElementById('exit-confirm');
    function openExitConfirm() {
      if (!exitConfirm) { exitGame(); return; }
      // 先暂停（如果还没暂停的话），再弹确认
      if (!isPaused) setPaused(true);
      exitConfirm.classList.add('show');
    }
    function closeExitConfirm() {
      if (exitConfirm) exitConfirm.classList.remove('show');
    }
    var exitOk = document.getElementById('exit-ok');
    var exitCancel = document.getElementById('exit-cancel');
    if (exitOk) {
      exitOk.addEventListener('click', function () {
        closeExitConfirm();
        exitGame();                 // 确认退出：彻底停掉引擎并返回
      });
      exitOk.addEventListener('touchend', function (e) {
        e.preventDefault();
        closeExitConfirm();
        exitGame();
      });
    }
    if (exitCancel) {
      exitCancel.addEventListener('click', function () {
        closeExitConfirm();
        // 留在局内：保持暂停态（方便玩家回来接着玩），按钮图标已正确显示 ▶
      });
      exitCancel.addEventListener('touchend', function (e) {
        e.preventDefault();
        closeExitConfirm();
      });
    }
    if (exitConfirm) {
      // 点击半透明背景 = 取消退出
      exitConfirm.addEventListener('click', function (e) {
        if (e.target === exitConfirm) closeExitConfirm();
      });
    }

    // 暂停态下的 back.png：点击后弹出“退出本局”确认浮层，
    // 而不是直接返回——这是修复“返回后游戏仍在后台运行”的关键一环。
    if (pauseBackEl) {
      pauseBackEl.addEventListener('click', function (e) {
        e.preventDefault();
        if (!isPaused) return;      // 非暂停态不响应（按钮此时隐藏，双重保险）
        openExitConfirm();           // 先暂停 + 弹确认
      });
      pauseBackEl.addEventListener('touchend', function (e) {
        e.preventDefault();
        if (!isPaused) return;
        openExitConfirm();
      });
    }

    // ---------------- 播报 ----------------
    function addFeedMessage(text, color) {
      const feed = document.getElementById('kill-feed');
      const div = document.createElement('div');
      div.className = 'feed-msg';
      div.innerHTML = text;
      if (color) div.style.borderLeft = `4px solid ${color}`;
      feed.appendChild(div);

      if (feed.children.length > 4) {
        feed.removeChild(feed.firstChild);
      }

      setTimeout(() => {
        div.classList.add('fade-out');
        setTimeout(() => {
          if (div.parentNode) div.parentNode.removeChild(div);
        }, 500);
      }, 4000);
    }

    // ---------------- 开火 ----------------
    function fireBullet(shooter) {
      const now = Date.now();
      if (shooter.isPlayer) {
        if (now - lastShootTime < FIRE_RATE) return;
        lastShootTime = now;
      } else if (shooter.id === 'enemy') {
        if (now - lastEnemyShootTime < (shooter.id === 'enemy' ? ENEMY_FIRE_RATE : LUNI_FIRE_RATE)) return;
        lastEnemyShootTime = now;
      } else {
        if (now - lastLuniShootTime < ENEMY_FIRE_RATE) return;
        lastLuniShootTime = now;
      }

      let gx = shooter.width * 0.45;
      let gy = shooter.isPlayer ? shooter.height * 0.05 : shooter.height * 0.10;

      if (shooter.inTank) {
        gx = shooter.width * 0.45;
        gy = -shooter.height * 0.15;
      }

      if (shooter.inTank) SoundFX.tankShoot(); else SoundFX.shoot();

      bullets.push({
        x: shooter.x + shooter.width / 2 + (shooter.facingRight ? gx : -gx),
        y: shooter.y + shooter.height / 2 + gy,
        vx: shooter.facingRight ? (shooter.inTank ? SHELL_SPEED : BULLET_SPEED) : -(shooter.inTank ? SHELL_SPEED : BULLET_SPEED),
        size: shooter.inTank ? 15 : shooter.width * 0.04,
        ownerId: shooter.id,
        isShell: shooter.inTank,
        color: shooter.color
      });
    }

    // ---------------- 道具生成 ----------------
    function spawnRadio() {
  if (radio !== null) return;

  const RADIO_SIZE = 20;
  const margin = 60;                       // 离左右边缘留 60px 安全距离

  const minX = margin;
  const maxX = canvas.width - margin - RADIO_SIZE;

  // 屏幕太窄就不刷，防止计算出负数
  if (maxX <= minX) return;

  const randomX = minX + Math.random() * (maxX - minX);

  radio = {
    x: randomX,
    y: canvas.height - FLOOR_MARGIN - RADIO_SIZE,
    width: RADIO_SIZE,
    height: RADIO_SIZE,
    bornAt: Date.now()                     
    // 记录生成时间，方便以后加超时回收
  };
}

    function spawnMedkit() {
      if (medkits.length >= MAX_MEDKITS) return;
      const randomX = Math.random() * (canvas.width - 100) + 50;
      const size = 40;
      for (let m of medkits) {
        if (Math.abs(m.x - randomX) < 80) return;
      }
      medkits.push({ x: randomX, y: canvas.height - FLOOR_MARGIN - size, width: size, height: size, pulse: 0 });
    }

    // ---------------- AI ----------------
    function updateAI(ent) {
      if (ent.isDead) return;

      let targets = entities.filter(e => e.id !== ent.id && !e.isDead);
      if (targets.length === 0) return;

      let target = targets[0];
      let minDist = Math.abs(ent.x - target.x);
      for (let i = 1; i < targets.length; i++) {
        let d = Math.abs(ent.x - targets[i].x);
        if (d < minDist) { minDist = d; target = targets[i]; }
      }

      let targetX = target.x;
      let seekItem = false;

      if (!ent.inTank && radio !== null) {
        targetX = radio.x;
        seekItem = true;
      } else if (!ent.inTank && ent.hp < ent.maxHp && medkits.length > 0) {
        let closest = medkits[0];
        let mDist = Math.abs(ent.x - closest.x);
        for (let i = 1; i < medkits.length; i++) {
          let dist = Math.abs(ent.x - medkits[i].x);
          if (dist < mDist) { mDist = dist; closest = medkits[i]; }
        }
        targetX = closest.x;
        seekItem = true;
      }

      ent.facingRight = targetX > ent.x;

      if (ent.inTank) {
        if (Date.now() - ent.tankLastShoot > TANK_RELOAD_TIME) {
          fireBullet(ent); ent.tankLastShoot = Date.now();
        }
      } else if (!seekItem) {
        fireBullet(ent);
      }

      const fast = false;
      if (Date.now() > ent.aiMoveTimer) {
        const rand = Math.random();
        if (rand < 0.4) ent.aiMoveDir = -1;
        else if (rand < 0.7) ent.aiMoveDir = 1;
        else ent.aiMoveDir = 0;
        ent.aiMoveTimer = Date.now() + (1000 + Math.random() * 1500);
      }

      if (seekItem) ent.vx += (targetX > ent.x) ? (fast ? 2.5 : 1.2) : (fast ? -2.5 : -1.2);
      else {
        if (ent.aiMoveDir === -1) ent.vx -= (fast ? 1 : 0.5);
        else if (ent.aiMoveDir === 1) ent.vx += (fast ? 1 : 0.5);
        else ent.vx *= FRICTION;
      }

      let speed = ent.inTank ? MOVE_SPEED * 0.4 : MOVE_SPEED * (fast ? 1.0 : 0.6);
      if (ent.vx > speed) ent.vx = speed;
      if (ent.vx < -speed) ent.vx = -speed;
      if (Math.abs(ent.vx) < 0.1) ent.vx = 0;

      if (ent.isGrounded && Date.now() > ent.aiJumpCooldown && !ent.inTank) {
        let dodge = false;
        for (let b of bullets) {
          if (b.ownerId !== ent.id && Math.abs(b.x - ent.x) < 150 && Math.abs(b.y - (ent.y + ent.height / 2)) < 50) {
            dodge = true; break;
          }
        }
        if (dodge) {
          ent.vy = JUMP_FORCE;
          ent.isGrounded = false;
          SoundFX.jump();
          ent.aiJumpCooldown = Date.now() + (ent.id === 'enemy' ? 1000 : 2200);
        }
      }
    }

    // ---------------- 主更新 ----------------
    function update() {
      if (loadedImages < 5 || isPaused) return;
      const now = Date.now();

      if (now - lastRadioSpawnTime > RADIO_SPAWN_INTERVAL) { spawnRadio(); lastRadioSpawnTime = now; }
      if (now - lastMedkitSpawnTime > MEDKIT_SPAWN_INTERVAL) { spawnMedkit(); lastMedkitSpawnTime = now; }

      entities.forEach(ent => {
        if (ent.isDead && now > ent.respawnTimer) respawn(ent);
      });

      // ---- 玩家操作 ----
      if (!player.isDead) {
        if (controls.shoot && !player.inTank) fireBullet(player);

        if (joystickInputX !== 0) {
          player.vx += joystickInputX * 1.8;
          player.facingRight = joystickInputX > 0;
        } else {
          player.vx *= FRICTION;
        }

        let speed = player.inTank ? MOVE_SPEED * 0.4 : MOVE_SPEED;
        if (player.vx > speed) player.vx = speed;
        if (player.vx < -speed) player.vx = -speed;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;

        if (controls.jump && player.isGrounded && !player.inTank) {
          player.vy = JUMP_FORCE; player.isGrounded = false;
          SoundFX.jump();
        }
      }

      // ---- AI ----
      updateAI(enemy);
      updateAI(luni);

      // ---- 物理 + 道具拾取 ----
      entities.forEach(ent => {
        if (ent.isDead) return;

        ent.vy += GRAVITY;
        ent.x += ent.vx;
        ent.y += ent.vy;

        const floorY = canvas.height - FLOOR_MARGIN;
        if (ent.y + ent.height > floorY) {
          ent.y = floorY - ent.height;
          ent.vy = 0; ent.isGrounded = true;
          ent.isTeleporting = false;
        } else {
          ent.isGrounded = false;
        }

        if (ent.x < 0) ent.x = 0;
        if (ent.x + ent.width > canvas.width) ent.x = canvas.width - ent.width;

        // 拾取对讲机 → 变坦克
        if (!ent.inTank && radio !== null) {
          if (ent.x < radio.x + radio.width && ent.x + ent.width > radio.x &&
              ent.y < radio.y + radio.height && ent.y + ent.height > radio.y) {

            ent.inTank = true;
            ent.preTankHp = ent.hp;
            ent.tankHp = ent.tankMaxHp;
            ent.tankLastShoot = 0;

            const baseH = window.innerHeight * 0.28;
            ent.height = baseH * 1.5;
            ent.width = tankImg.width * (ent.height / tankImg.height);

            ent.y = canvas.height - FLOOR_MARGIN - ent.height;
            radio = null;
            SoundFX.radio();
            addFeedMessage(`<span style="color:${ent.color}">${ent.name}</span> 捡到了对讲机并呼叫了坦克`, ent.color);
          }
        }

        // 拾取急救包
        for (let i = medkits.length - 1; i >= 0; i--) {
          let m = medkits[i];
          if (ent.x < m.x + m.width && ent.x + ent.width > m.x &&
              ent.y < m.y + m.height && ent.y + ent.height > m.y) {
            ent.hp = ent.maxHp;
            medkits.splice(i, 1);
            SoundFX.pickup();
            addFeedMessage(`<span style="color:${ent.color}">${ent.name}</span> 捡到了急救包`, ent.color);
          }
        }
      });

      // ---- 角色之间的碰撞 ----
      for (let i = 0; i < entities.length; i++) {
        for (let j = i + 1; j < entities.length; j++) {
          let a = entities[i], b = entities[j];
          if (a.isDead || b.isDead) continue;
          if (!a.inTank && !b.inTank) continue;

          let aInAir = !a.isGrounded, bInAir = !b.isGrounded;

          if (!aInAir && !bInAir && a.x < b.x + b.width && a.x + a.width > b.x) {
            let overlap = Math.min(a.x + a.width - b.x, b.x + b.width - a.x);
            if (overlap > 2) {
              if (a.inTank && !b.inTank) {
                if (a.x < b.x) b.x += overlap; else b.x -= overlap;
              }
              else if (!a.inTank && b.inTank) {
                if (b.x < a.x) a.x += overlap; else a.x -= overlap;
              }
              else {
                if (a.x < b.x) { a.x -= overlap / 2; b.x += overlap / 2; }
                else { a.x += overlap / 2; b.x -= overlap / 2; }
              }
            }
            if (a.x < 0) a.x = 0;
            if (a.x + a.width > canvas.width) a.x = canvas.width - a.width;
            if (b.x < 0) b.x = 0;
            if (b.x + b.width > canvas.width) b.x = canvas.width - b.width;
          }

          if (!a.isTeleporting && aInAir && !bInAir) {
            let bCenter = b.x + b.width / 2;
            let aCenter = a.x + a.width / 2;
            if (aCenter > bCenter - 10 && aCenter < bCenter + 10) {
              if (a.vx > 0) a.x = b.x + b.width + 5;
              else if (a.vx < 0) a.x = b.x - a.width - 5;
              a.isTeleporting = true;
            }
          }
          if (!b.isTeleporting && bInAir && !aInAir) {
            let aCenter = a.x + a.width / 2;
            let bCenter = b.x + b.width / 2;
            if (bCenter > aCenter - 10 && bCenter < aCenter + 10) {
              if (b.vx > 0) b.x = a.x + a.width + 5;
              else if (b.vx < 0) b.x = a.x - b.width - 5;
              b.isTeleporting = true;
            }
          }
        }
      }

      // ---- 子弹飞行与命中 ----
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;

        if (b.x < -50 || b.x > canvas.width + 50) {
          bullets.splice(i, 1); continue;
        }

        for (let target of entities) {
          if (target.isDead || target.id === b.ownerId) continue;

          if (b.x > target.x && b.x < target.x + target.width &&
              b.y > target.y && b.y < target.y + target.height) {

            let killed = false;
            SoundFX.hit();

            if (target.inTank) {
              let dmg = b.isShell ? (target.tankMaxHp * 0.4) : 15;
              target.tankHp -= dmg;

              if (target.tankHp <= 0) {
                target.tankHp = 0;
                target.inTank = false;
                target.hp = target.preTankHp;
                SoundFX.explode();

                target.height = window.innerHeight * 0.28;
                target.width = target.img.width * (target.height / target.img.height);
                target.y = canvas.height - FLOOR_MARGIN - target.height;
              }
            } else {
              let dmg = b.isShell ? (target.maxHp * 0.7) : 15;
              target.hp -= dmg;
              if (target.hp <= 0) {
                target.hp = 0;
                target.isDead = true;
                target.respawnTimer = Date.now() + RESPAWN_TIME;
                SoundFX.explode();
                killed = true;
              } else {
                SoundFX.hurt();
              }
            }

            if (killed) {
              let killer = entities.find(e => e.id === b.ownerId);
              if (killer) {
                killer.kills++;
                addFeedMessage(`<span style="color:${killer.color}">${killer.name}</span> 击杀了 <span style="color:${target.color}">${target.name}</span>`, '#ff3333');
              }
            }

            bullets.splice(i, 1);
            break;
          }
        }
      }

      // ---- 坦克按住开火 ----
      if (player.inTank && controls.shoot) {
        if (now - player.tankLastShoot > TANK_RELOAD_TIME) {
          fireBullet(player);
          player.tankLastShoot = now;
        }
      }
    }

    // ---------------- 装填进度条 ----------------
    const reloadBarContainer = document.getElementById('reload-bar-container');
    const reloadBar = document.getElementById('reload-bar');

    function updateReloadBar() {
      const now = Date.now();

      if (player.isDead) {
        reloadBarContainer.style.display = 'none';
        return;
      }

      if (player.inTank) {
        const progress = Math.min((now - player.tankLastShoot) / TANK_RELOAD_TIME, 1);
        reloadBarContainer.style.display = 'block';
        reloadBar.style.transform = `scaleX(${progress})`;
        reloadBar.style.backgroundColor = progress >= 1 ? '#32CD32' : '#FF8C00';
      } else if (now - lastShootTime < FIRE_RATE) {
        const progress = (now - lastShootTime) / FIRE_RATE;
        reloadBarContainer.style.display = 'block';
        reloadBar.style.transform = `scaleX(${progress})`;
        reloadBar.style.backgroundColor = '#FF8C00';
      } else {
        reloadBarContainer.style.display = 'none';
      }
    }

    // ---------------- 绘制：对讲机 ----------------
    function drawRadio() {
      if (radio === null) return;

      ctx.save();
      const cx = radio.x + radio.width / 2;
      const cy = radio.y + radio.height / 2;

      ctx.translate(cx, cy);

      if (radioImg.complete && radioImg.width > 0) {
      ctx.drawImage(radioImg, -radio.width / 2, -radio.height / 2, radio.width, radio.height);

      } else {
        ctx.fillStyle = '#FFC800';
        ctx.fillRect(-radio.width / 2, -radio.height / 2, radio.width, radio.height);
      }
      ctx.restore();
    }

    // ---------------- 绘制：急救包 ----------------
    function drawMedkits() {
  medkits.forEach(m => {
    const cx = m.x + m.width / 2;
    const cy = m.y + m.height / 2;
    const s = m.width; // 重新补上变量s的定义

    ctx.save();
    ctx.translate(cx, cy);
    
    // 光晕
    ctx.beginPath();
    ctx.arc(0, 0, m.width * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 80, 80, 0.20)';
    ctx.fill();

    // 绘制新急救包图片
    if (medkitImg.complete && medkitImg.width > 0) {
      ctx.drawImage(medkitImg, -s / 2, -s / 2, s, s);
    } else {
      // 如果图片还没加载好，先画个红方块占位防崩溃
      ctx.fillStyle = '#ff3333';
      ctx.fillRect(-s / 2, -s / 2, s, s);
    }

    ctx.restore(); // 确保画布状态恢复
  });
}

    // ---------------- 绘制：角色 ----------------
        // 工具函数：画圆角矩形
    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 工具函数：画倒三角
    function drawInvertedTriangle(ctx, x, y, w, h, color) {
      ctx.beginPath();
      ctx.moveTo(x - w / 2, y);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x, y + h);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

        function drawEntity(ent) {
      if (ent.isDead) return;

      const cx = ent.x + ent.width / 2;
      const cy = ent.y + ent.height / 2;

      ctx.save();
      ctx.translate(cx, cy);

      // 图片未加载好时用默认比例，避免除零/NaN
      const safeRatio = (!ent.img.complete || ent.img.height <= 0)
        ? 0.6
        : (ent.img.width / ent.img.height);
      const baseW = window.innerHeight * 0.28 * safeRatio;
      const barW = baseW * 0.85;

      const barH = 6;
      const barY = ent.inTank ? (-ent.height - -55) : (-ent.height / 2 - 14);
// ---- 角色本体 ----
ctx.save();
if (!ent.facingRight) ctx.scale(-1, 1);

if (ent.inTank) {
  // 坦克状态：只画坦克，不画人
  if (tankImg && tankImg.complete && tankImg.width > 0) {
    ctx.save();
    ctx.globalAlpha = 1.0;
    ctx.drawImage(tankImg, -ent.width / 2, -ent.height / 2, ent.width, ent.height);
    ctx.restore();
  } else {
    ctx.fillStyle = '#555';
    ctx.fillRect(-ent.width / 2, -ent.height / 2, ent.width, ent.height);
  }
} else {
  // 普通状态：只画人物
  if (ent.img.complete && ent.img.width > 0) {
    ctx.drawImage(ent.img, -ent.width / 2, -ent.height / 2, ent.width, ent.height);
  } else {
    ctx.fillStyle = ent.color;
    ctx.fillRect(-ent.width / 2, -ent.height / 2, ent.width, ent.height);
  }
}

  ctx.restore();
      
      // ---- 圆角血条 ----
      const ratio = ent.inTank
        ? Math.max(ent.tankHp / ent.tankMaxHp, 0)
        : Math.max(ent.hp / ent.maxHp, 0);

      // 底色
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-barW / 2, barY, barW, barH, barH / 2);
      else ctx.rect(-barW / 2, barY, barW, barH);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fill();

      // 血量
      if (ratio > 0) {
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-barW / 2, barY, barW * ratio, barH, barH / 2);
        else ctx.rect(-barW / 2, barY, barW * ratio, barH);
        ctx.fillStyle = '#32CD32';
        ctx.fill();
      }

      // 描边
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(-barW / 2, barY, barW, barH, barH / 2);
      else ctx.rect(-barW / 2, barY, barW, barH);
      ctx.strokeStyle = ent.color;
      ctx.lineWidth = 2;
      ctx.stroke();

      // ---- 玩家蓝色倒三角（血条正上方）----
      if (ent.isPlayer) {
        const tipY = barY - 5;
        ctx.beginPath();
        ctx.moveTo(0, tipY);
        ctx.lineTo(-8, tipY - 13);
        ctx.lineTo(8, tipY - 13);
        ctx.closePath();
        ctx.fillStyle = '#00BFFF';
        ctx.fill();
      }

      ctx.restore();
    }

    // ---------------- 绘制：子弹 ----------------
    function drawBullets() {
      bullets.forEach(b => {
        ctx.save();
        ctx.beginPath();

        if (b.isShell) {
          // 炮弹：亮橙黄色带光晕
          ctx.shadowColor = '#FF6600';
          ctx.shadowBlur = 12;
          ctx.fillStyle = '#FFB300';
          ctx.arc(b.x, b.y, b.size / 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#FF4500';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          // 普通子弹：白色带角色色描边
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 8;
          ctx.fillStyle = '#ffffff';
          ctx.arc(b.x, b.y, Math.max(b.size / 2, 3), 0, Math.PI * 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = b.color;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.restore();
      });
    }

    // ---------------- 绘制：复活倒计时 ----------------
        function drawRespawnUI() {
      if (!player.isDead) return;

      const remain = Math.max(player.respawnTimer - Date.now(), 0);
      const seconds = (remain / 1000).toFixed(1);

      const cx = canvas.width / 2;
      const cy = canvas.height * 0.28;

      ctx.save();
      ctx.textAlign = 'center';

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      const boxW = 190, boxH = 74;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH, 10);
      } else {
        ctx.rect(cx - boxW / 2, cy - boxH / 2, boxW, boxH);
      }
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px Arial';
      ctx.fillText('复活倒计时', cx, cy - 4);

      ctx.fillStyle = player.color;
      ctx.font = 'bold 30px Arial';
      ctx.fillText(seconds + 's', cx, cy + 28);

      ctx.restore();
    }

    // ---------------- 绘制：击杀榜 ----------------
        function drawLeaderboard() {
      const sorted = entities.slice().sort((a, b) => b.kills - a.kills);

      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px Arial';

      const cellW = 100;
      const totalW = sorted.length * cellW;
      const startX = canvas.width / 2 - totalW / 2;
      const baseY = 18;

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(startX - 10, baseY - 6, totalW + 20, 44, 8);
      } else {
        ctx.rect(startX - 10, baseY - 6, totalW + 20, 44);
      }
      ctx.fill();

      sorted.forEach((ent, i) => {
        const x = startX + i * cellW + cellW / 2;

        ctx.fillStyle = ent.color;
        ctx.font = 'bold 14px Arial';
        ctx.fillText(ent.name, x, baseY + 12);

        ctx.fillStyle = '#ffffff';
        ctx.font = '13px Arial';
        ctx.fillText('击杀 ' + ent.kills, x, baseY + 30);
      });

      ctx.restore();
    }

    // ---------------- 绘制总入口 ----------------
        function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f0f0f0';
      ctx.fillRect(0, canvas.height - FLOOR_MARGIN, canvas.width, FLOOR_MARGIN);
      ctx.strokeStyle = '#d0d0d0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - FLOOR_MARGIN);
      ctx.lineTo(canvas.width, canvas.height - FLOOR_MARGIN);
      ctx.stroke();

      drawRadio();
      drawMedkits();
      entities.forEach(ent => drawEntity(ent));
      drawBullets();
      drawRespawnUI();
      drawLeaderboard();

      // 注：暂停文字已改为 DOM 遮罩层（#pause-overlay），不再在 canvas 上绘制，
      // 避免返回派对选择后 canvas 残留“暂停”字样、或与复活倒计时层叠字。
      // if (isPaused) { ... ctx.fillText('暂停', ...) ... }
    }

    // ---------------- 主循环 ----------------
    // animFrameId 保存 requestAnimationFrame 的句柄，用于彻底退出游戏时
    // 调用 cancelAnimationFrame 停掉循环，而不是只把 isPaused 置为 true
    // （只置 true 会停更新，但循环仍在跑、计时器仍在累加，下次进局就乱了）。
    let animFrameId = 0;

    function gameLoop() {
      animFrameId = requestAnimationFrame(gameLoop);
      update();
      draw();
      updateReloadBar();
    }

    // ---------------- 启动 ----------------
    resizeCanvas();
    gameLoop();
  }
  </script>
</body>
